lang: zh-CN
timezone: Asia/Shanghai

title: Bnear8273's Blog
tagline: 什么是生活？
description: 写的人是她本人吗？

url: "https://bnear8273.github.io"

github:
  username: Bnear8273

social:
  name: Bnear8273
  email: bnear8273@qq.com
  links:
    - https://github.com/Bnear8273

theme: jekyll-theme-chirpy

theme_mode:

avatar: /assets/img/avatar.png

toc: true

comments:
  provider:

analytics:
  google:
    id:

pageviews:
  provider:

pwa:
  enabled: true

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
